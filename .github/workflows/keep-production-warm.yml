# Prisma Compute scales an idle service to zero and has no setting to stop it
# (see .claude/skills/deploy-production), so the first request after a quiet
# spell took 30s+. Pinging production every 5 minutes keeps it awake.
# ponytail: fixed URL — update it if prod-fra is ever recreated. GitHub runs
# schedules late under load and pauses them after 60 days without commits.
name: Keep production warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 60 --retry 2 --retry-delay 5 https://n8rxh8cjn8a87hvwbn2fynhm.fra.prisma.build/api/health
